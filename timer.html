<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
body {
  margin: 0;
  padding: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: #CC252C;
  color: #ffffff;
}

.container {
  text-align: center;
  padding: 30px 20px;
}

.header {
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 5px;
}

#timer {
  font-size: 28px;
  font-weight: 700;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">
  <div class="header">Commencement</div>
  <div class="header">Spring-2026</div>
  <div id="timer"></div>
</div>

<script>
const targetDate = new Date(2026, 1, 2, 23, 59, 59).getTime();


setInterval(() => {
  const now = new Date().getTime();
  const diff = targetDate - now;

  if (diff <= 0) {
    document.getElementById("timer").innerHTML = "Event Started";
    return;
  }

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

  document.getElementById("timer").innerHTML =
    days + " Days : " + hours + " Hours";
}, 1000);
</script>

</body>
</html>
