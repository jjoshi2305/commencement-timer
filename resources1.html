  li {
    display: flex;
    align-items: center;
    gap: 12px;

    font-size: 15px;
    cursor: pointer;

    border: 1px solid #ffffff;   /* White border */

    margin-bottom: 12px;

    transition: all 0.2s ease;
  }

  li:hover {
    background-color: rgba(255,255,255,0.2);
  }

  li:active {

  }

    width: 22px;
    text-align: center;
  }

    color: #ffffff;
    text-decoration: none;
