<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quote of the Day</title>

<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 40px;
  }

  .quote-container {
    max-width: 700px;
    margin: auto;
    background: #ffffff;
    padding: 30px 40px;
    border-left: 6px solid #1e3a8a;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    border-radius: 8px;
  }

  .quote-title {
    font-size: 20px;
    font-weight: 600;
    color: #1e3a8a;
    margin-bottom: 15px;
  }

  .quote-text {
    font-size: 22px;
    line-height: 1.6;
    color: #333;
    font-style: italic;
  }

  .quote-author {
    margin-top: 20px;
    text-align: right;
    font-size: 16px;
    font-weight: 500;
    color: #555;
  }
</style>
</head>

<body>

<div class="quote-container">
  <div class="quote-title">Quote of the Day</div>

  <div class="quote-text">
    “Education is the most powerful weapon which you can use to change the world.”
  </div>

  <div class="quote-author">
    — Nelson Mandela
  </div>
</div>

</body>
</html>
