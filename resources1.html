<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>University Resources</title>

<style>
  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background-color: #9b1c31; /* Cherry Red */
    color: #ffffff;
  }

  .container {
    padding: 20px;
  }

  h3 {
    margin-bottom: 18px;
    font-size: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.4);
    padding-bottom: 8px;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  /* BUTTON STYLE FOR EACH OPTION */
  li {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 12px 14px;
    font-size: 15px;
    cursor: pointer;

    border: 1px solid #ffffff;   /* White border */
    border-radius: 6px;
    margin-bottom: 12px;

    transition: all 0.2s ease;
  }

  li:hover {
    background-color: rgba(255,255,255,0.2);
  }

  li:active {
    transform: scale(0.98);
  }

  .icon {
    font-size: 18px;
    width: 22px;
    text-align: center;
  }

  a {
    color: #ffffff;
    text-decoration: none;
    width: 100%;
    display: block;
  }
</style>
</head>

<body>
  <div class="container">
    <h3>University Resources</h3>

    <ul>
      <li>
        <span class="icon">📅</span>
        <a href="https://jgu.edu.in/storage/62/Academic-Calendar+.pdf" target="_blank"
     rel="noopener noreferrer">Academic Calendar 2025–2026</a>
      </li>

      <li>
        <span class="icon">👤</span>
        <a href="#">HR & Payroll Portal</a>
      </li>

      <li>
        <span class="icon">🛠</span>
        <a href="#">IT Support & Helpdesk</a>
      </li>

      <li>
        <span class="icon">📝</span>
        <a href="#">Room & Event Booking</a>
      </li>

      <li>
        <span class="icon">🚨</span>
        <a href="#">Campus Safety Contacts</a>
      </li>

      <li>
        <span class="icon">👥</span>
        <a href="#">Faculty & Staff Directory</a>
      </li>

      <li>
        <span class="icon">📁</span>
        <a href="#">University Forms</a>
      </li>

      <li>
        <span class="icon">📄</span>
        <a href="#">University Policies</a>
      </li>
    </ul>
  </div>
</body>
</html>
